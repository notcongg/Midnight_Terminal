```yaml
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================================
  # Python
  # ==========================================================

  python:
    name: Python ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.13"
          - "3.14"

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install pytest

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        shell: bash
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests directory found."
          fi

      - name: Import hardware collectors
        run: |
          python -c "from src.cmd.rootfs.hwinfo.collection.cpu import collect_cpu"
          python -c "from src.cmd.rootfs.hwinfo.collection.ram import collect_ram"
          python -c "from src.cmd.rootfs.hwinfo.collection.storage import collect_storage"
          python -c "from src.cmd.rootfs.hwinfo.collection.network import collect_network"
          python -c "from src.cmd.rootfs.hwinfo.collection.gpu import collect_gpu"
          python -c "from src.cmd.rootfs.hwinfo.collection.monitor import collect_monitors"

      - name: Smoke test collectors
        run: |
          python -c "from src.cmd.rootfs.hwinfo.collection.cpu import collect_cpu; print(collect_cpu())"
          python -c "from src.cmd.rootfs.hwinfo.collection.ram import collect_ram; print(collect_ram())"
          python -c "from src.cmd.rootfs.hwinfo.collection.storage import collect_storage; print(collect_storage())"
          python -c "from src.cmd.rootfs.hwinfo.collection.network import collect_network; print(collect_network())"


  # ==========================================================
  # Native Linux
  # ==========================================================

  native-linux:
    name: Native / Linux
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools and libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libsodium-dev

      # --------------------------------------------------------
      # HWINFO
      # --------------------------------------------------------

      - name: Configure HWINFO RAM
        shell: bash
        run: |
          if [ -f src/cmd/rootfs/hwinfo/collection/ram/CMakeLists.txt ]; then
            cmake \
              -S src/cmd/rootfs/hwinfo/collection/ram \
              -B build-hwinfo-linux
          else
            echo "HWINFO RAM CMake project not found."
            exit 1
          fi

      - name: Build HWINFO RAM
        run: |
          cmake \
            --build build-hwinfo-linux \
            --config Release

      # --------------------------------------------------------
      # PS
      # --------------------------------------------------------

      - name: Configure PS
        shell: bash
        run: |
          if [ -f src/cmd/rootfs/ps/CMakeLists.txt ]; then
            cmake \
              -S src/cmd/rootfs/ps \
              -B build-ps-linux \
              -DCMAKE_BUILD_TYPE=Release
          else
            echo "PS CMake project not found."
            exit 1
          fi

      - name: Build PS
        run: |
          cmake \
            --build build-ps-linux \
            --config Release

      - name: Test PS command
        shell: bash
        run: |
          python3 - <<'PY'
          import ctypes
          import pathlib

          dll = pathlib.Path("build-ps-linux/libmidnight_ps.so")

          if not dll.exists():
              raise SystemExit(
                  f"PS library not found: {dll}"
              )

          lib = ctypes.CDLL(str(dll))

          lib.midnight_ps_run.argtypes = [
              ctypes.c_int,
              ctypes.POINTER(ctypes.c_char_p),
          ]
          lib.midnight_ps_run.restype = ctypes.c_char_p

          def run_ps(args):
              encoded = [arg.encode("utf-8") for arg in args]
              argv = (
                  ctypes.c_char_p * len(encoded)
              )(*encoded)

              result = lib.midnight_ps_run(
                  len(encoded),
                  argv,
              )

              if not result:
                  raise RuntimeError(
                      "midnight_ps_run returned NULL"
                  )

              return result.decode(
                  "utf-8",
                  errors="replace",
              )

          tests = [
              ["ps"],
              ["ps", "-a"],
              ["ps", "-n=5"],
              ["ps", "-sort=cpu"],
          ]

          for args in tests:
              print(f"$ {' '.join(args)}")

              output = run_ps(args)

              if not output.strip():
                  raise RuntimeError(
                      f"PS returned empty output for: {args}"
                  )

              print(output)

          print("PS Linux runtime test passed.")

      # --------------------------------------------------------
      # MSUP
      # --------------------------------------------------------

      - name: Configure MSUP
        run: |
          cmake \
            -S src/cmd/rootfs/msup \
            -B build-msup-linux

      - name: Build MSUP
        run: |
          cmake \
            --build build-msup-linux \
            --config Release

      - name: Install MSUP runtime
        shell: bash
        run: |
          mkdir -p src/cmd/rootfs/msup/platform/linux

          cp \
            build-msup-linux/libmidnight_msup.so \
            src/cmd/rootfs/msup/platform/linux/libmidnight_msup.so

      # --------------------------------------------------------
      # MSUP runtime test
      # --------------------------------------------------------

      - name: Test MSUP Python bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from src.cmd.rootfs.msup.msup import is_active, cmd_msup

          assert is_active() is False

          cmd_msup("-status")

          assert is_active() is False

          print("MSUP Linux bridge test passed.")
          PY


  # ==========================================================
  # Native Windows
  # ==========================================================

  native-windows:
    name: Native / Windows
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # --------------------------------------------------------
      # vcpkg + libsodium
      # --------------------------------------------------------

      - name: Install libsodium
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install libsodium:x64-windows

      - name: Add libsodium to PATH
        shell: pwsh
        run: |
          $sodiumBin = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\bin"
          echo "$sodiumBin" >> $env:GITHUB_PATH

      # --------------------------------------------------------
      # HWINFO
      # --------------------------------------------------------

      - name: Configure HWINFO RAM
        shell: pwsh
        run: |
          if (Test-Path "src/cmd/rootfs/hwinfo/collection/ram/CMakeLists.txt") {
            cmake `
              -S src/cmd/rootfs/hwinfo/collection/ram `
              -B build-hwinfo-windows
          }
          else {
            Write-Error "HWINFO RAM CMake project not found."
            exit 1
          }

      - name: Build HWINFO RAM
        run: |
          cmake `
            --build build-hwinfo-windows `
            --config Release

      # --------------------------------------------------------
      # PS
      # --------------------------------------------------------

      - name: Configure PS
        shell: pwsh
        run: |
          if (Test-Path "src/cmd/rootfs/ps/CMakeLists.txt") {
            cmake `
              -S src/cmd/rootfs/ps `
              -B build-ps-windows `
              -DCMAKE_BUILD_TYPE=Release
          }
          else {
            Write-Error "PS CMake project not found."
            exit 1
          }

      - name: Build PS
        run: |
          cmake `
            --build build-ps-windows `
            --config Release

      - name: Test PS command
        shell: pwsh
        run: |
          $psDll = Get-ChildItem `
            -Path "build-ps-windows" `
            -Filter "midnight_ps.dll" `
            -Recurse |
            Select-Object -First 1

          if (-not $psDll) {
            Write-Error "midnight_ps.dll was not built."
            exit 1
          }

          $env:PS_DLL = $psDll.FullName

          python -c @'
          import ctypes
          import os

          dll_path = os.environ["PS_DLL"]

          lib = ctypes.WinDLL(dll_path)

          lib.midnight_ps_run.argtypes = [
              ctypes.c_int,
              ctypes.POINTER(ctypes.c_char_p),
          ]
          lib.midnight_ps_run.restype = ctypes.c_char_p

          def run_ps(args):
              encoded = [arg.encode("utf-8") for arg in args]
              argv = (
                  ctypes.c_char_p * len(encoded)
              )(*encoded)

              result = lib.midnight_ps_run(
                  len(encoded),
                  argv,
              )

              if not result:
                  raise RuntimeError(
                      "midnight_ps_run returned NULL"
                  )

              return result.decode(
                  "utf-8",
                  errors="replace",
              )

          tests = [
              ["ps"],
              ["ps", "-a"],
              ["ps", "-n=5"],
              ["ps", "-sort=cpu"],
          ]

          for args in tests:
              print(f"$ {' '.join(args)}")

              output = run_ps(args)

              if not output.strip():
                  raise RuntimeError(
                      f"PS returned empty output for: {args}"
                  )

              print(output)

          print("PS Windows runtime test passed.")
          '@

      # --------------------------------------------------------
      # MSUP
      # --------------------------------------------------------

      - name: Configure MSUP
        shell: pwsh
        run: |
          cmake `
            -S src/cmd/rootfs/msup `
            -B build-msup-windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build MSUP
        run: |
          cmake `
            --build build-msup-windows `
            --config Release

      - name: Install MSUP runtime
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "src/cmd/rootfs/msup/platform/windows" |
            Out-Null

          $msupDll = Get-ChildItem `
            -Path "build-msup-windows" `
            -Filter "midnight_msup.dll" `
            -Recurse |
            Select-Object -First 1

          if (-not $msupDll) {
            Write-Error "midnight_msup.dll was not built."
            exit 1
          }

          Copy-Item `
            $msupDll.FullName `
            "src/cmd/rootfs/msup/platform/windows/midnight_msup.dll" `
            -Force

          $sodiumDll = "vcpkg\installed\x64-windows\bin\libsodium.dll"

          if (-not (Test-Path $sodiumDll)) {
            Write-Error "libsodium.dll was not found."
            exit 1
          }

          Copy-Item `
            $sodiumDll `
            "src/cmd/rootfs/msup/platform/windows/libsodium.dll" `
            -Force

      # --------------------------------------------------------
      # MSUP runtime test
      # --------------------------------------------------------

      - name: Test MSUP Python bridge
        shell: pwsh
        run: |
          python -c "from src.cmd.rootfs.msup.msup import is_active; assert is_active() is False; print('MSUP Windows bridge test passed.')"
```
